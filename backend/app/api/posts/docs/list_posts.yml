tags:
  - Posts
summary: Lista posts paginados (feed)
security:
  - Bearer: []
produces:
  - application/json
parameters:
  - in: query
    name: page
    type: integer
    required: false
    default: 1
  - in: query
    name: page_size
    type: integer
    required: false
    default: 20
    description: Máximo 100
responses:
  200:
    description: Lista de posts
    schema:
      type: object
      properties:
        ok:
          type: boolean
        posts:
          type: array
          items:
            type: object
        pagination:
          type: object
  401:
    description: Token JWT ausente o inválido
