tags:
  - Posts
summary: Actualiza una publicación (solo el autor)
description: >
  Actualiza parcialmente un post existente. Solo el usuario que lo creó puede
  modificarlo. Se actualizan únicamente los campos que se envíen.

  Reglas de imágenes:
    - `images: [...]`  → reemplaza la lista completa de imágenes (máx 5).
    - `images: []`     → elimina todas las imágenes del post.
    - No enviar        → las imágenes existentes no se modifican.

  Para multipart: cualquier archivo subido en `images` reemplaza la lista completa.

  Soporta application/json y multipart/form-data.
security:
  - Bearer: []
consumes:
  - application/json
  - multipart/form-data
produces:
  - application/json
parameters:
  - in: path
    name: post_id
    type: string
    required: true
    description: ID del post a actualizar
  - in: body
    name: body
    required: false
    schema:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          example: "Texto actualizado"
        media_urls:
          type: array
          items:
            type: string
          description: Reemplaza la lista completa. Enviar [] para vaciarla.
        images:
          type: array
          maxItems: 5
          description: Reemplaza la lista completa de imágenes. Enviar [] para eliminarlas todas.
          items:
            type: object
            required: [base64, mime]
            properties:
              base64:
                type: string
              mime:
                type: string
                enum: ["image/png", "image/jpeg", "image/jpg", "image/gif", "image/webp"]
  - in: formData
    name: content
    type: string
    required: false
  - in: formData
    name: images
    type: file
    required: false
    description: >
      Nuevas imágenes (max 5 MB c/u, máx 5 archivos). Reemplazan la lista actual.
      Repetir el campo para subir varias: fd.append('images', file1)
responses:
  200:
    description: Post actualizado correctamente
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        post:
          type: object
          properties:
            id:         {type: string}
            content:    {type: string}
            images:
              type: array
              items:
                type: object
                properties:
                  base64: {type: string}
                  mime:   {type: string}
            updated_at: {type: string}
  400:
    description: Validación fallida o sin campos para actualizar
  401:
    description: Token JWT ausente o inválido
  403:
    description: El usuario autenticado no es el autor del post
  404:
    description: Post no encontrado
