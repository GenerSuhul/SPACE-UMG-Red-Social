tags:
  - Reactions
summary: Elimina la reacción del usuario sobre un comentario
security:
  - Bearer: []
produces:
  - application/json
parameters:
  - in: path
    name: post_id
    type: string
    required: true
  - in: path
    name: comment_id
    type: string
    required: true
responses:
  200:
    description: Reacción eliminada
  400:
    description: No existe reacción del usuario
  401:
    description: Token JWT ausente o inválido
