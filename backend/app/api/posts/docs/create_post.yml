tags:
  - Posts
summary: Crea una nueva publicación
description: >
  Crea una publicación cuyo autor es el usuario autenticado (obtenido del JWT).
security:
  - Bearer: []
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - content
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          example: "Mi primer post en la red social"
        media_urls:
          type: array
          items:
            type: string
          example: ["https://example.com/img1.png"]
responses:
  201:
    description: Post creado correctamente
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        post:
          type: object
  400:
    description: Error de validación
  401:
    description: Token JWT ausente o inválido
