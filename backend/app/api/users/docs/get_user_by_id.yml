summary: Obtener perfil público de un usuario por id
description: >
  Devuelve el perfil público de cualquier usuario a partir de su id.
  No expone datos sensibles como email o estado de cuenta.
  Útil para mostrar el perfil de un usuario antes de interactuar con él.
tags:
  - Users
security:
  - BearerAuth: []
parameters:
  - in: path
    name: user_id
    required: true
    schema:
      type: string
    description: ObjectId del usuario
responses:
  200:
    description: Perfil público del usuario
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        user:
          type: object
          properties:
            id:
              type: string
              example: "64b1f2c3d4e5f6a7b8c9d0e1"
            username:
              type: string
              example: "john_doe"
            first_name:
              type: string
              example: "John"
            last_name:
              type: string
              example: "Doe"
            age:
              type: integer
              example: 25
            avatar_base64:
              type: string
              nullable: true
              example: null
            avatar_mime:
              type: string
              nullable: true
              example: null
  400:
    description: Id de usuario inválido
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  404:
    description: Usuario no encontrado
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
  401:
    description: Token JWT ausente o inválido
