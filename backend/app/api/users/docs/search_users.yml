summary: Búsqueda de usuarios por username
description: >
  Devuelve una lista de perfiles públicos cuyos usernames coincidan
  (parcial, case-insensitive) con el término enviado en `q`.
  Solo expone datos públicos: id, username, nombre, edad y avatar.
tags:
  - Users
security:
  - BearerAuth: []
parameters:
  - in: query
    name: q
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 50
    description: Término de búsqueda (substring del username)
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      default: 20
      minimum: 1
      maximum: 50
    description: Cantidad máxima de resultados
responses:
  200:
    description: Lista de usuarios encontrados
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        total:
          type: integer
          example: 3
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "64b1f2c3d4e5f6a7b8c9d0e1"
              username:
                type: string
                example: "john_doe"
              first_name:
                type: string
                example: "John"
              last_name:
                type: string
                example: "Doe"
              age:
                type: integer
                example: 25
              avatar_base64:
                type: string
                nullable: true
                example: null
              avatar_mime:
                type: string
                nullable: true
                example: null
  400:
    description: Término de búsqueda inválido
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  401:
    description: Token JWT ausente o inválido
