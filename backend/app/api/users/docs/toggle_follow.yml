summary: Toggle follow / unfollow de un usuario
description: >
  Si el usuario autenticado NO sigue a `target_user_id`, lo agrega a su lista
  `following` y se agrega a sí mismo en la lista `followers` del target.
  Si YA lo sigue, elimina ambas referencias. La acción ejecutada se devuelve
  en el campo `action` ("followed" | "unfollowed"), junto con los conteos
  finales de followers/following del target.
tags:
  - Users
security:
  - BearerAuth: []
parameters:
  - in: path
    name: target_user_id
    required: true
    schema:
      type: string
    description: ObjectId del usuario a seguir / dejar de seguir
responses:
  200:
    description: Toggle aplicado correctamente
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        action:
          type: string
          enum: [followed, unfollowed]
          example: followed
        target_user:
          type: object
          properties:
            id:
              type: string
              example: "64b1f2c3d4e5f6a7b8c9d0e1"
            username:
              type: string
              example: "john_doe"
            first_name:
              type: string
              example: "John"
            last_name:
              type: string
              example: "Doe"
        followers_count:
          type: integer
          example: 5
        following_count:
          type: integer
          example: 3
  400:
    description: Id inválido, intento de auto-seguirse o error al persistir
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  404:
    description: Usuario objetivo no encontrado
    schema:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  401:
    description: Token JWT ausente o inválido
