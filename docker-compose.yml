services:

  mongodb-red-social:
    image: mongo:latest
    container_name: mongoc-red-social
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_DB_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_DB_PASSWORD
    volumes:
      - mongo_red_social:/data/db
    networks:
      - space-network

  mongodb-express-red-social:
    image: mongo-express:latest
    container_name: mongoc-express-red-social
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: $MONGO_DB_USERNAME
      ME_CONFIG_MONGODB_ADMINPASSWORD: $MONGO_DB_PASSWORD
      ME_CONFIG_MONGODB_SERVER: mongodb-red-social
      ME_CONFIG_BASICAUTH_USERNAME: $MONGO_DB_USERNAME
      ME_CONFIG_BASICAUTH_PASSWORD: $MONGO_DB_PASSWORD
    depends_on:
      - mongodb-red-social
    networks:
      - space-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space-backend
    ports:
      - "8800:8800"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://$MONGO_DB_USERNAME:$MONGO_DB_PASSWORD@mongodb-red-social:27017/mongo_red_social?authSource=admin}
    depends_on:
      - mongodb-red-social
    networks:
      - space-network

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: space-websocket
    ports:
      - "8888:8888"
    networks:
      - space-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: space-frontend
    # No bind ports on host to avoid conflicts. Traefik routes directly inside shared network.
    depends_on:
      - backend
      - websocket
    networks:
      - space-network
    labels:
      - "traefik.enable=true"
      # HTTP Router (Port 80)
      - "traefik.http.routers.space-frontend.rule=Host(`space.umg.kyrosoftgs.com`)"
      - "traefik.http.routers.space-frontend.entrypoints=web"
      # HTTPS Router (Port 443 with TLS Auto-SSL)
      - "traefik.http.routers.space-frontend-secure.rule=Host(`space.umg.kyrosoftgs.com`)"
      - "traefik.http.routers.space-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.space-frontend-secure.tls=true"
      - "traefik.http.routers.space-frontend-secure.tls.certresolver=letsencrypt"
      # Point to frontend Nginx container port 80
      - "traefik.http.services.space-frontend-service.loadbalancer.server.port=80"

volumes:
  mongo_red_social:

networks:
  space-network:
    driver: bridge
